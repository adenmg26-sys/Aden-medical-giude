<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أنت غير متصل بالإنترنت - مرشد عدن الطبي</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f0f4ff 0%, #f8fafc 50%, #fff5f5 100%);
            color: #1e293b;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            padding: 20px;
        }
        .container {
            max-width: 400px;
            background: rgba(255,255,255,0.85);
            backdrop-filter: blur(20px);
            padding: 48px 32px;
            border-radius: 28px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.08);
            border: 1px solid rgba(255,255,255,0.6);
        }
        .icon-wrap {
            width: 80px; height: 80px;
            background: linear-gradient(135deg, #dbeafe, #e0e7ff);
            border-radius: 24px;
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 24px;
            font-size: 36px;
            box-shadow: 0 8px 24px rgba(23,67,122,0.12);
        }
        h1 { font-size: 22px; margin-bottom: 12px; color: #17437a; }
        p { color: #64748b; line-height: 1.7; font-size: 14px; margin-bottom: 8px; }
        .hint { font-size: 12px; color: #94a3b8; margin-top: 8px; margin-bottom: 28px; }
        .buttons { display: flex; flex-direction: column; gap: 12px; }
        .btn {
            display: block;
            text-decoration: none;
            padding: 14px 24px;
            border-radius: 16px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            border: none;
        }
        .btn-primary {
            background: linear-gradient(135deg, #17437a, #1e5baa);
            color: white;
            box-shadow: 0 4px 16px rgba(23,67,122,0.25);
        }
        .btn-primary:hover { opacity: 0.9; transform: translateY(-1px); }
        .btn-secondary {
            background: white;
            color: #17437a;
            border: 2px solid #e2e8f0;
        }
        .btn-secondary:hover { background: #f8fafc; border-color: #cbd5e1; }
        .footer { margin-top: 32px; font-size: 11px; color: #cbd5e1; }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon-wrap">📡</div>
        <h1>أنت غير متصل بالإنترنت</h1>
        <p>لا يمكن الوصول إلى هذه الصفحة حالياً لأنك غير متصل بالإنترنت.</p>
        <p class="hint">💡 جرّب فتح الصفحة الرئيسية — البيانات المحملة مسبقاً ستكون متاحة للتصفح بدون إنترنت.</p>
        <div class="buttons">
            <a href="/" class="btn btn-primary">🏠 فتح الصفحة الرئيسية</a>
            <button onclick="window.location.reload()" class="btn btn-secondary">🔄 إعادة المحاولة</button>
        </div>
    </div>
    <div class="footer">مرشد عدن الطبي — يعمل بدون إنترنت</div>
</body>
</html>
